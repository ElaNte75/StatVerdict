name: ClassCodex live data refresh

on:
  schedule:
    # Weekly. The upstream build host itself refreshes far more often (the
    # source data is regenerated roughly daily) -- this can move to a
    # tighter cron later with no code change if that turns out worth it.
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: classcodex-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lupa

      - name: Run existing tests
        run: python -m unittest discover -s tools/tests

      - name: Fetch and build the live ClassCodex data
        run: python tools/classcodex_cli.py

      - name: Commit generated data
        run: |
          if [ -z "$(git status --porcelain -- StatVerdict/Data/Generated/SV_ClassCodexLiveData.lua)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "StatVerdict Benchmark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StatVerdict/Data/Generated/SV_ClassCodexLiveData.lua
          git commit -m "data: refresh live ClassCodex data"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push failed after 5 attempts."
          exit 1
