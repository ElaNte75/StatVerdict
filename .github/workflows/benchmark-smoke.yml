name: Benchmark engine smoke test

on:
  push:
    branches: [main]
    paths:
      - "tools/live_benchmark_engine.py"
      - "tools/simc_stat_engine.py"
      - "tools/tests/**"
      - ".github/workflows/benchmark-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-engine-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: pip install lupa
      - name: Run deterministic tests
        run: python -m unittest discover -s tools/tests -v

      - name: Check out SimulationCraft Midnight
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: .simc-source
          fetch-depth: 1

      - name: Identify SimulationCraft revision
        id: simc-ref
        shell: bash
        run: echo "sha=$(git -C .simc-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SimulationCraft build
        id: simc-cache
        uses: actions/cache@v5
        with:
          path: .simc-build
          key: ${{ runner.os }}-simc-midnight-${{ steps.simc-ref.outputs.sha }}

      - name: Build SimulationCraft CLI
        if: steps.simc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S .simc-source -B .simc-build -G Ninja \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .simc-build --target simc --parallel 2

      - name: Verify API pipeline with small cohorts
        run: |
          python tools/live_benchmark_engine.py \
            --cohorts 3 \
            --max-pages 1 \
            --max-run-checks 1 \
            --max-insufficient-specs 40 \
            --candidate-multiplier 1 \
            --regions eu \
            --simc-bin .simc-build/simc \
            --workers 4 \
            --json-out "$RUNNER_TEMP/SV_LiveBenchmarkData.json" \
            --lua-out "$RUNNER_TEMP/SV_LiveBenchmarkData.lua"
