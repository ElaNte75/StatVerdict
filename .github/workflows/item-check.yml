name: Item check (Enhancement Shaman)

# Manual only: simulates every candidate item of one real character with
# SimulationCraft (tools/item_check.py) and commits the result table to
# docs/item-check/. It never touches the ClassCodex generated data.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "SimC iteration cap per run"
        required: false
        default: "30000"
      target_error:
        description: "SimC target_error (%) -- a run stops early once reached"
        required: false
        default: "0.05"

permissions:
  contents: write

concurrency:
  group: item-check
  cancel-in-progress: false

jobs:
  item-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lupa

      # Tests first: fail fast before spending CI minutes on a SimC build.
      - name: Run existing tests
        env:
          SV_SKIP_REAL_DATA_TESTS: "1"
        run: python -m unittest discover -s tools/tests

      # Same SimC checkout / cache key / build as classcodex-live-refresh.yml,
      # so the two workflows share one cached build per SimC revision.
      - name: Check out SimulationCraft Midnight
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: .simc-source
          fetch-depth: 1

      - name: Identify SimulationCraft revision
        id: simc-ref
        shell: bash
        run: echo "sha=$(git -C .simc-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SimulationCraft build
        id: simc-cache
        uses: actions/cache@v5
        with:
          path: .simc-build
          key: ${{ runner.os }}-simc-midnight-${{ steps.simc-ref.outputs.sha }}

      - name: Build SimulationCraft CLI
        if: steps.simc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S .simc-source -B .simc-build -G Ninja \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .simc-build --target simc --parallel 2

      - name: Run the item check
        env:
          ITERATIONS: ${{ inputs.iterations || '30000' }}
          TARGET_ERROR: ${{ inputs.target_error || '0.05' }}
        run: |
          python tools/item_check.py --simc-bin .simc-build/simc --threads 4 \
            --iterations "$ITERATIONS" --target-error "$TARGET_ERROR"

      # The addon's own verdict on the same items, lined up against SimC's answer.
      - name: Replay the addon verdict
        run: PYTHONPATH=.:tools python tools/item_check_verdict.py docs/item-check/enhancement_shaman.json

      # Uploaded even when the run fails or times out: the tool rewrites
      # the files after every simulation, so a partial table is kept.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-check-results
          path: docs/item-check/
          if-no-files-found: warn

      - name: Commit results
        shell: bash
        run: |
          files=(docs/item-check/enhancement_shaman.md docs/item-check/enhancement_shaman.json docs/item-check/enhancement_shaman_verdict.md)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "StatVerdict Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "data: item check results"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push failed after 5 attempts."
          exit 1
