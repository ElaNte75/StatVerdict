name: Benchmark retry

on:
  schedule:
    # A few hours after "Live benchmark refresh" (same days), so that run
    # has finished. Retries only the specs it recorded as failed/insufficient.
    - cron: "0 21 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-benchmarks
  cancel-in-progress: false

jobs:
  retry:
    name: Retry failed specs
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check retry queue
        id: queue
        shell: bash
        run: |
          file="tools/data/benchmark_retry_queue.json"
          if [ ! -f "$file" ]; then
            echo "No retry queue file yet; nothing to retry."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(python -c "import json; print(len(json.load(open('$file')).get('specs') or []))")
          echo "Retry queue has $count spec(s)."
          if [ "$count" -gt 0 ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.queue.outputs.pending == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out SimulationCraft Midnight
        if: steps.queue.outputs.pending == 'true'
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: .simc-source
          fetch-depth: 1

      - name: Identify SimulationCraft revision
        if: steps.queue.outputs.pending == 'true'
        id: simc-ref
        shell: bash
        run: echo "sha=$(git -C .simc-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SimulationCraft build
        if: steps.queue.outputs.pending == 'true'
        id: simc-cache
        uses: actions/cache@v5
        with:
          path: .simc-build
          key: ${{ runner.os }}-simc-midnight-${{ steps.simc-ref.outputs.sha }}

      - name: Build SimulationCraft CLI
        if: steps.queue.outputs.pending == 'true' && steps.simc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S .simc-source -B .simc-build -G Ninja \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .simc-build --target simc --parallel 2

      - name: Install test dependency
        run: pip install lupa
      - name: Run engine tests
        if: steps.queue.outputs.pending == 'true'
        run: python -m unittest discover -s tools/tests -v

      - name: Rebuild only the failed specs
        if: steps.queue.outputs.pending == 'true'
        run: |
          python tools/live_benchmark_engine.py \
            --specs-file tools/data/benchmark_retry_queue.json \
            --cohorts 25,100,200 \
            --max-pages 100 \
            --regions eu,us,kr,tw \
            --simc-bin .simc-build/simc \
            --workers 8 \
            --json-out retry-partial.json \
            --lua-out retry-partial.lua

      # There is no single combined file (see weekly-benchmarks.yml) -
      # data is split per role into tools/data/live/SV_LiveBenchmarkData_<Role>.json,
      # each with its own disjoint set of specs. A retry batch can contain
      # specs from several of those files, so route each retried spec back
      # into whichever file already owns it, instead of merging everything
      # into one place.
      - name: Route each retried spec back into its own role file
        if: steps.queue.outputs.pending == 'true'
        shell: bash
        run: |
          cat > /tmp/filter_retry.py <<'PYEOF'
          import json
          import sys

          target_path, retry_path, out_path = sys.argv[1:4]
          retried = json.load(open(retry_path))
          owned = json.load(open(target_path))["profiles"]
          overlap = {k: v for k, v in retried["profiles"].items() if k in owned}
          if overlap:
              out = dict(retried)
              out["profiles"] = overlap
              json.dump(out, open(out_path, "w"))
              print(len(overlap))
          else:
              print(0)
          PYEOF

          for target in tools/data/live/SV_LiveBenchmarkData_*.json; do
            filtered="${target%.json}.retry-filtered.json"
            count=$(python /tmp/filter_retry.py "$target" retry-partial.json "$filtered")
            if [ "$count" -gt 0 ]; then
              echo "Folding $count spec(s) into $target"
              python tools/live_benchmark_engine.py \
                --cohorts 25,100,200 \
                --merge-inputs "$target,$filtered" \
                --allow-merge-override \
                --json-out "$target" \
                --lua-out /tmp/retry-fold.lua
              rm -f "$filtered"
            fi
          done

          python tools/live_benchmark_engine.py \
            --cohorts 25,100,200 \
            --merge-inputs "$(ls tools/data/live/SV_LiveBenchmarkData_*.json | paste -sd,)" \
            --json-out /tmp/coverage-check.json \
            --lua-out /tmp/coverage-check.lua \
            --retry-queue-out tools/data/benchmark_retry_queue.json

      - name: Build the addon's Mythic+ file
        if: steps.queue.outputs.pending == 'true'
        run: python tools/addon_benchmarks.py --inputs tools/data/live --out StatVerdict/Data/Generated/SV_MythicPlusBenchmarks.lua

      - name: Commit retried update
        if: steps.queue.outputs.pending == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- StatVerdict/Data/Generated tools/data/live tools/data/benchmark_retry_queue.json)" ]; then
            echo "No benchmark changes."
            exit 0
          fi
          git config user.name "StatVerdict Benchmark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/live/SV_LiveBenchmarkData_*.json
          git add StatVerdict/Data/Generated/SV_MythicPlusBenchmarks.lua
          git add tools/data/benchmark_retry_queue.json
          git commit -m "data: retry failed benchmark specs"
          # See weekly-benchmarks.yml's Commit step: only generated data
          # files changed here, so rebasing onto a moved main is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push the retried benchmark update after 5 attempts."
          exit 1
