name: Live benchmark refresh

on:
  schedule:
    # Check twice monthly; unchanged data produces no commit.
    - cron: "0 15 1,15 * *"
  workflow_dispatch:
    inputs:
      cohorts:
        description: "Comma-separated leaderboard rank ceilings"
        required: true
        default: "25,100,200"
      max_pages:
        description: "Maximum Raider.IO specialization-ranking pages"
        required: true
        default: "100"

permissions:
  contents: write

concurrency:
  group: live-benchmarks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out SimulationCraft Midnight
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: .simc-source
          fetch-depth: 1

      - name: Identify SimulationCraft revision
        id: simc-ref
        shell: bash
        run: echo "sha=$(git -C .simc-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SimulationCraft build
        id: simc-cache
        uses: actions/cache@v5
        with:
          path: .simc-build
          key: ${{ runner.os }}-simc-midnight-${{ steps.simc-ref.outputs.sha }}

      - name: Build SimulationCraft CLI
        if: steps.simc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S .simc-source -B .simc-build -G Ninja \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .simc-build --target simc --parallel 2

      - name: Run engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Build live benchmark database
        env:
          COHORTS: ${{ inputs.cohorts || '25,100,200' }}
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
        run: |
          python tools/live_benchmark_engine.py \
            --cohorts "$COHORTS" \
            --max-pages "$MAX_PAGES" \
            --regions eu,us,kr,tw \
            --simc-bin .simc-build/simc \
            --workers 8

      - name: Validate generated database
        env:
          COHORTS: ${{ inputs.cohorts || '25,100,200' }}
        run: |
          python tools/live_benchmark_engine.py \
            --cohorts "$COHORTS" \
            --validate-only StatVerdict/Data/Generated/SV_LiveBenchmarkData.json

      - name: Commit validated update
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- StatVerdict/Data/Generated/SV_LiveBenchmarkData.json StatVerdict/Data/Generated/SV_LiveBenchmarkData.lua)" ]; then
            echo "No benchmark changes."
            exit 0
          fi
          git config user.name "StatVerdict Benchmark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StatVerdict/Data/Generated/SV_LiveBenchmarkData.json
          git add StatVerdict/Data/Generated/SV_LiveBenchmarkData.lua
          git commit -m "data: refresh live benchmarks"
          git push
