name: Live benchmark refresh

on:
  schedule:
    # Check twice monthly; unchanged data produces no commit.
    - cron: "0 15 1,15 * *"
  workflow_dispatch:
    inputs:
      cohorts:
        description: "Comma-separated leaderboard rank ceilings"
        required: true
        default: "25,100,200"
      max_pages:
        description: "Maximum Raider.IO specialization-ranking pages"
        required: true
        default: "100"

permissions:
  contents: write

concurrency:
  group: live-benchmarks
  cancel-in-progress: false

jobs:
  # Each role group runs as its own job so one slow/stuck spec only affects
  # its own group, not the other specs. Healers run in their own job below:
  # SimulationCraft does not simulate healing at all (it is a DPS/damage
  # simulator), so they use a different, Wowhead-tooltip-based
  # reconstruction path that needs no SimC build.
  collect:
    name: Collect — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: dps-1
            label: "DPS Group 1"
            specs: "DEATHKNIGHT_FROST,DEATHKNIGHT_UNHOLY,DEMONHUNTER_DEVOURER,DEMONHUNTER_HAVOC,DRUID_BALANCE,DRUID_FERAL,EVOKER_AUGMENTATION"
          - group: dps-2
            label: "DPS Group 2"
            specs: "EVOKER_DEVASTATION,HUNTER_BEAST_MASTERY,HUNTER_MARKSMANSHIP,HUNTER_SURVIVAL,MAGE_ARCANE,MAGE_FIRE,MAGE_FROST"
          - group: dps-3
            label: "DPS Group 3"
            specs: "MONK_WINDWALKER,PALADIN_RETRIBUTION,PRIEST_SHADOW,ROGUE_ASSASSINATION,ROGUE_OUTLAW,ROGUE_SUBTLETY,SHAMAN_ELEMENTAL"
          - group: dps-4
            label: "DPS Group 4"
            specs: "SHAMAN_ENHANCEMENT,WARLOCK_AFFLICTION,WARLOCK_DEMONOLOGY,WARLOCK_DESTRUCTION,WARRIOR_ARMS,WARRIOR_FURY"
          - group: tank
            label: "Tank"
            specs: "DEATHKNIGHT_BLOOD,DEMONHUNTER_VENGEANCE,DRUID_GUARDIAN,MONK_BREWMASTER,PALADIN_PROTECTION,WARRIOR_PROTECTION"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out SimulationCraft Midnight
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: .simc-source
          fetch-depth: 1

      - name: Identify SimulationCraft revision
        id: simc-ref
        shell: bash
        run: echo "sha=$(git -C .simc-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SimulationCraft build
        id: simc-cache
        uses: actions/cache@v5
        with:
          path: .simc-build
          key: ${{ runner.os }}-simc-midnight-${{ steps.simc-ref.outputs.sha }}

      - name: Build SimulationCraft CLI
        if: steps.simc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S .simc-source -B .simc-build -G Ninja \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .simc-build --target simc --parallel 2

      - name: Run engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Build partial benchmark database (${{ matrix.label }})
        env:
          COHORTS: ${{ inputs.cohorts || '25,100,200' }}
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
        run: |
          python tools/live_benchmark_engine.py \
            --specs "${{ matrix.specs }}" \
            --cohorts "$COHORTS" \
            --max-pages "$MAX_PAGES" \
            --regions eu,us,kr,tw \
            --simc-bin .simc-build/simc \
            --workers 8 \
            --json-out "partial-${{ matrix.group }}.json" \
            --lua-out "partial-${{ matrix.group }}.lua"

      - name: Upload partial database
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.group }}
          path: |
            partial-${{ matrix.group }}.json
            partial-${{ matrix.group }}.lua
          retention-days: 3

  collect-healer:
    name: Collect — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: healer-1
            label: "Healer Group 1"
            specs: "DRUID_RESTORATION,EVOKER_PRESERVATION"
          - group: healer-2
            label: "Healer Group 2"
            specs: "MONK_MISTWEAVER,PALADIN_HOLY"
          - group: healer-3
            label: "Healer Group 3"
            specs: "PRIEST_DISCIPLINE,PRIEST_HOLY"
          - group: healer-4
            label: "Healer Group 4"
            specs: "SHAMAN_RESTORATION"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAIDERIO_ACCESS_KEY: ${{ secrets.RAIDERIO_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Build partial benchmark database (${{ matrix.label }})
        env:
          COHORTS: ${{ inputs.cohorts || '25,100,200' }}
          MAX_PAGES: ${{ inputs.max_pages || '100' }}
        run: |
          python tools/live_benchmark_engine.py \
            --specs "${{ matrix.specs }}" \
            --cohorts "$COHORTS" \
            --max-pages "$MAX_PAGES" \
            --regions eu,us,kr,tw \
            --workers 4 \
            --json-out "partial-${{ matrix.group }}.json" \
            --lua-out "partial-${{ matrix.group }}.lua"

      - name: Upload partial database
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.group }}
          path: |
            partial-${{ matrix.group }}.json
            partial-${{ matrix.group }}.lua
          retention-days: 3

  merge:
    name: Merge & validate
    needs: [collect, collect-healer]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download partial databases
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partials
          merge-multiple: true

      # No single combined file: one 40-spec database was 170MB+ (past
      # GitHub's 100MB limit). Instead, check the 9 partials together cover
      # all 40 specs with no gaps/overlap (throwaway output, not committed -
      # this step is only for that check and the retry queue), then keep each
      # role group as its own raw JSON file in tools/data/live/ (outside the
      # addon folder). Only the small compact file built from them by
      # tools/addon_benchmarks.py goes into the addon.
      - name: Validate full spec coverage across all groups
        env:
          COHORTS: ${{ inputs.cohorts || '25,100,200' }}
        run: |
          python tools/live_benchmark_engine.py \
            --cohorts "$COHORTS" \
            --merge-inputs "partials/partial-dps-1.json,partials/partial-dps-2.json,partials/partial-dps-3.json,partials/partial-dps-4.json,partials/partial-tank.json,partials/partial-healer-1.json,partials/partial-healer-2.json,partials/partial-healer-3.json,partials/partial-healer-4.json" \
            --json-out /tmp/coverage-check.json \
            --lua-out /tmp/coverage-check.lua \
            --retry-queue-out tools/data/benchmark_retry_queue.json

      - name: Recombine the 4 healer groups into one Healer file
        env:
          COHORTS: ${{ inputs.cohorts || '25,100,200' }}
        run: |
          python tools/live_benchmark_engine.py \
            --cohorts "$COHORTS" \
            --merge-inputs "partials/partial-healer-1.json,partials/partial-healer-2.json,partials/partial-healer-3.json,partials/partial-healer-4.json" \
            --json-out tools/data/live/SV_LiveBenchmarkData_Healer.json \
            --lua-out /tmp/healer-raw.lua

      - name: Place the DPS/Tank files under their final names
        shell: bash
        run: |
          declare -A rename=(
            [dps-1]=DPS1 [dps-2]=DPS2 [dps-3]=DPS3 [dps-4]=DPS4 [tank]=Tank
          )
          for group in "${!rename[@]}"; do
            label="${rename[$group]}"
            cp "partials/partial-${group}.json" "tools/data/live/SV_LiveBenchmarkData_${label}.json"
          done

      - name: Build the addon's Mythic+ file
        run: python tools/addon_benchmarks.py --inputs tools/data/live --out StatVerdict/Data/Generated/SV_MythicPlusBenchmarks.lua

      - name: Commit validated update
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- StatVerdict/Data/Generated tools/data/live tools/data/benchmark_retry_queue.json)" ]; then
            echo "No benchmark changes."
            exit 0
          fi
          git config user.name "StatVerdict Benchmark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/live/SV_LiveBenchmarkData_*.json
          git add StatVerdict/Data/Generated/SV_MythicPlusBenchmarks.lua
          git add tools/data/benchmark_retry_queue.json
          git commit -m "data: refresh live benchmarks"
          # main can move while this job runs (a code push, or another
          # instance of this workflow). Only the generated data files
          # changed here, so rebasing onto the latest main is safe -
          # retry a few times instead of losing a successful run's result.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push benchmark update after 5 attempts."
          exit 1
