name: ClassCodex stat-weight refresh

on:
  schedule:
    # Roughly every 15 days -- game-balance changes are infrequent, unlike
    # the weekly ClassCodex BiS/gear refresh.
    - cron: "0 12 1,16 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: classcodex-stat-weights
  cancel-in-progress: false

jobs:
  # Real scale-factor sims (10k-iteration cap, target_error 0.1, 5 sims per
  # combo -- see tools/classcodex_weights.py) for ~235 spec/goal/hero-talent
  # combos do not fit one GitHub-hosted job, so the spec list is sharded the
  # same way weekly-benchmarks.yml shards it. Each shard is ~6-7 specs, i.e.
  # ~36-42 combos, well inside its timeout. tools/tests/test_classcodex_weights_cli.py
  # checks these groups cover every spec exactly once.
  collect:
    name: Weights — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: dps-1
            label: "DPS Group 1"
            specs: "DEATHKNIGHT_FROST,DEATHKNIGHT_UNHOLY,DEMONHUNTER_DEVOURER,DEMONHUNTER_HAVOC,DRUID_BALANCE,DRUID_FERAL,EVOKER_AUGMENTATION"
          - group: dps-2
            label: "DPS Group 2"
            specs: "EVOKER_DEVASTATION,HUNTER_BEAST_MASTERY,HUNTER_MARKSMANSHIP,HUNTER_SURVIVAL,MAGE_ARCANE,MAGE_FIRE,MAGE_FROST"
          - group: dps-3
            label: "DPS Group 3"
            specs: "MONK_WINDWALKER,PALADIN_RETRIBUTION,PRIEST_SHADOW,ROGUE_ASSASSINATION,ROGUE_OUTLAW,ROGUE_SUBTLETY,SHAMAN_ELEMENTAL"
          - group: dps-4
            label: "DPS Group 4"
            specs: "SHAMAN_ENHANCEMENT,WARLOCK_AFFLICTION,WARLOCK_DEMONOLOGY,WARLOCK_DESTRUCTION,WARRIOR_ARMS,WARRIOR_FURY"
          - group: tank
            label: "Tank"
            specs: "DEATHKNIGHT_BLOOD,DEMONHUNTER_VENGEANCE,DRUID_GUARDIAN,MONK_BREWMASTER,PALADIN_PROTECTION,WARRIOR_PROTECTION"
          - group: healer
            label: "Healer"
            specs: "DRUID_RESTORATION,EVOKER_PRESERVATION,MONK_MISTWEAVER,PALADIN_HOLY,PRIEST_DISCIPLINE,PRIEST_HOLY,SHAMAN_RESTORATION"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lupa

      # Tests first: fail fast before spending CI minutes on a SimC build.
      - name: Run existing tests
        run: python -m unittest discover -s tools/tests

      - name: Check out SimulationCraft Midnight
        uses: actions/checkout@v5
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: .simc-source
          fetch-depth: 1

      - name: Identify SimulationCraft revision
        id: simc-ref
        shell: bash
        run: echo "sha=$(git -C .simc-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore SimulationCraft build
        id: simc-cache
        uses: actions/cache@v5
        with:
          path: .simc-build
          key: ${{ runner.os }}-simc-midnight-${{ steps.simc-ref.outputs.sha }}

      - name: Build SimulationCraft CLI
        if: steps.simc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S .simc-source -B .simc-build -G Ninja \
            -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build .simc-build --target simc --parallel 2

      - name: Build partial stat weights (${{ matrix.label }})
        run: |
          python tools/classcodex_weights_cli.py \
            --simc-bin .simc-build/simc \
            --specs "${{ matrix.specs }}" \
            --partial-out "partial-weights-${{ matrix.group }}.json"

      - name: Upload partial stat weights
        uses: actions/upload-artifact@v4
        with:
          name: partial-weights-${{ matrix.group }}
          path: partial-weights-${{ matrix.group }}.json
          retention-days: 3

  # Runs only when every shard succeeded (default `needs` behaviour): a
  # crashed/timed-out shard means no update at all this cycle, never a file
  # with a whole role group silently missing.
  merge:
    name: Merge & commit
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lupa

      - name: Download partial stat weights
        uses: actions/download-artifact@v4
        with:
          pattern: partial-weights-*
          path: partials
          merge-multiple: true

      # Applies the fail-closed gate once over the combined result: refuses
      # an empty result or one covering <80% of the committed file's contexts.
      - name: Merge partial stat weights
        run: |
          python tools/classcodex_weights_cli.py \
            --merge-inputs "partials/partial-weights-dps-1.json,partials/partial-weights-dps-2.json,partials/partial-weights-dps-3.json,partials/partial-weights-dps-4.json,partials/partial-weights-tank.json,partials/partial-weights-healer.json"

      - name: Commit generated data
        run: |
          if [ -z "$(git status --porcelain -- StatVerdict/Data/Generated/SV_ClassCodexWeights.lua)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "StatVerdict Benchmark Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StatVerdict/Data/Generated/SV_ClassCodexWeights.lua
          git commit -m "data: refresh ClassCodex stat weights"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push failed after 5 attempts."
          exit 1
